<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos | Gestión Taller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-navbar"></div>

    <main class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h5 class="mb-0"><i class="bi bi-cash-coin me-2"></i>Pagos</h5>
                <div class="d-flex gap-2 align-items-center">
                    <select class="form-select form-select-sm" id="filtro-orden" style="min-width: 220px;">
                        <option value="">Todas las órdenes</option>
                    </select>
                    <button type="button" class="btn btn-info" id="btn-nuevo-pago">
                        <i class="bi bi-plus-lg me-1"></i>Nuevo pago
                    </button>
                </div>
            </div>
            <div class="card-body">
                <table id="tabla-pagos" class="table table-striped table-hover w-100">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Monto</th>
                            <th>Orden N°</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modal-pago" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="form-pago" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-pago-titulo">Nuevo pago</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="pago-orden" class="form-label">Orden de trabajo *</label>
                            <select class="form-select" id="pago-orden" required>
                                <option value="">Seleccione una orden</option>
                            </select>
                            <div class="invalid-feedback">Debe seleccionar una orden.</div>
                        </div>
                        <div id="pago-info" class="alert alert-light border d-none mb-3"></div>
                        <div class="mb-3">
                            <label for="pago-fecha" class="form-label">Fecha de pago</label>
                            <input type="datetime-local" class="form-control" id="pago-fecha">
                        </div>
                        <div class="mb-3">
                            <label for="pago-monto" class="form-label">Monto *</label>
                            <input type="number" class="form-control" id="pago-monto" min="0.01" step="0.01" required>
                            <div class="invalid-feedback">El monto debe ser mayor a 0.</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/pagos.js"></script>
</body>
</html>
