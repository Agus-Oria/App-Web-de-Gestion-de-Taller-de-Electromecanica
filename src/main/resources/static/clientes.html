<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | Gestión Taller</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-navbar"></div>

    <main class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-people me-2"></i>Clientes</h5>
                <button type="button" class="btn btn-primary" id="btn-nuevo-cliente">
                    <i class="bi bi-plus-lg me-1"></i>Nuevo cliente
                </button>
            </div>
            <div class="card-body">
                <div class="row g-2 mb-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small mb-1" for="buscar-cliente-dni">Buscar por DNI</label>
                        <input type="text" class="form-control" id="buscar-cliente-dni" placeholder="Ingrese un DNI">
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button type="button" class="btn btn-primary" id="btn-buscar-cliente">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="btn-limpiar-busqueda">
                            <i class="bi bi-x-lg me-1"></i>Limpiar
                        </button>
                    </div>
                </div>
                <table id="tabla-clientes" class="table table-striped table-hover w-100">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>DNI</th>
                            <th>Teléfono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modal-cliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="form-cliente" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-cliente-titulo">Nuevo cliente</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="cliente-nombre" class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="cliente-nombre" maxlength="100" required>
                            <div class="invalid-feedback">El nombre es obligatorio (máx. 100 caracteres).</div>
                        </div>
                        <div class="mb-3">
                            <label for="cliente-apellido" class="form-label">Apellido *</label>
                            <input type="text" class="form-control" id="cliente-apellido" maxlength="100" required>
                            <div class="invalid-feedback">El apellido es obligatorio (máx. 100 caracteres).</div>
                        </div>
                        <div class="mb-3">
                            <label for="cliente-dni" class="form-label">DNI *</label>
                            <input type="text" class="form-control" id="cliente-dni" maxlength="20" required>
                            <div class="invalid-feedback">El DNI es obligatorio (máx. 20 caracteres).</div>
                        </div>
                        <div class="mb-3">
                            <label for="cliente-telefono" class="form-label">Teléfono *</label>
                            <input type="text" class="form-control" id="cliente-telefono" maxlength="30" required>
                            <div class="invalid-feedback">El teléfono es obligatorio (máx. 30 caracteres).</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
