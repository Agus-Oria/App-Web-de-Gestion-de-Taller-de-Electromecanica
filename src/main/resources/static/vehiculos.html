<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos | Gestión Taller</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <div id="app-navbar"></div>

    <main class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-car-front me-2"></i>Vehículos</h5>
                <button type="button" class="btn btn-success" id="btn-nuevo-vehiculo">
                    <i class="bi bi-plus-lg me-1"></i>Nuevo vehículo
                </button>
            </div>
            <div class="card-body">
                <div class="row g-2 mb-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small mb-1" for="buscar-vehiculo-patente">Buscar por patente</label>
                        <input type="text" class="form-control" id="buscar-vehiculo-patente" placeholder="Ingrese una patente">
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button type="button" class="btn btn-primary" id="btn-buscar-patente">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="btn-limpiar-busqueda">
                            <i class="bi bi-x-lg me-1"></i>Limpiar
                        </button>
                    </div>
                </div>
                <table id="tabla-vehiculos" class="table table-striped table-hover w-100">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Patente</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Año</th>
                            <th>Color</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modal-vehiculo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="form-vehiculo" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-vehiculo-titulo">Nuevo vehículo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="vehiculo-patente" class="form-label">Patente *</label>
                            <input type="text" class="form-control" id="vehiculo-patente" maxlength="20" required>
                            <div class="invalid-feedback">La patente es obligatoria (máx. 20 caracteres).</div>
                        </div>
                        <div class="mb-3">
                            <label for="vehiculo-marca" class="form-label">Marca *</label>
                            <select class="form-select" id="vehiculo-marca" required>
                                <option value="">Seleccione una marca</option>
                            </select>
                            <div class="invalid-feedback">Seleccione una marca.</div>
                        </div>
                        <div class="mb-3">
                            <label for="vehiculo-modelo" class="form-label">Modelo *</label>
                            <input type="text" class="form-control" id="vehiculo-modelo" maxlength="80" required>
                            <div class="invalid-feedback">El modelo es obligatorio (máx. 80 caracteres).</div>
                        </div>
                        <div class="mb-3">
                            <label for="vehiculo-anio" class="form-label">Año *</label>
                            <input type="number" class="form-control" id="vehiculo-anio" min="1900" max="2100" required>
                            <div class="invalid-feedback">El año debe estar entre 1900 y 2100.</div>
                        </div>
                        <div class="mb-3">
                            <label for="vehiculo-color" class="form-label">Color</label>
                            <input type="text" class="form-control" id="vehiculo-color" maxlength="30" placeholder="Opcional">
                        </div>
                        <div class="mb-3">
                            <label for="vehiculo-chasis" class="form-label">N° de chasis</label>
                            <input type="text" class="form-control" id="vehiculo-chasis" maxlength="50" placeholder="Opcional">
                        </div>
                        <div class="mb-3">
                            <label for="vehiculo-motor" class="form-label">N° de motor</label>
                            <input type="text" class="form-control" id="vehiculo-motor" maxlength="50" placeholder="Opcional">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/configuracion.js"></script>
    <script src="js/vehiculos.js"></script>
</body>
</html>
