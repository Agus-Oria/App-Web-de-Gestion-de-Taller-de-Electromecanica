<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gestión Taller</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-wrench-adjustable display-4 text-primary"></i>
                    <h1 class="h4 mt-2">Gestión Taller</h1>
                    <p class="text-muted mb-0">Inicie sesión para continuar</p>
                </div>
                <form id="form-login" novalidate>
                    <div class="mb-3">
                        <label for="login-username" class="form-label">Nombre de usuario</label>
                        <input type="text" class="form-control" id="login-username" required autofocus>
                        <div class="invalid-feedback">Ingrese su nombre de usuario.</div>
                    </div>
                    <div class="mb-4">
                        <label for="login-password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="login-password" required>
                        <div class="invalid-feedback">Ingrese su contraseña.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btn-login">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
                    </button>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">
                    ¿No tiene una cuenta? <a href="register.html">Registrarse</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
