<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Gestión Taller</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="bg-body-tertiary">
    <main class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-wrench-adjustable display-4 text-primary"></i>
                    <h1 class="h4 mt-2">Gestión Taller</h1>
                    <p class="text-muted mb-0">Cree su cuenta para comenzar</p>
                </div>
                <form id="form-registro" novalidate>
                    <div class="mb-3">
                        <label for="registro-username" class="form-label">Nombre de usuario</label>
                        <input type="text" class="form-control" id="registro-username" minlength="3" maxlength="50" required autofocus>
                        <div class="invalid-feedback">El nombre de usuario debe tener entre 3 y 50 caracteres.</div>
                    </div>
                    <div class="mb-3">
                        <label for="registro-password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="registro-password" minlength="4" required>
                        <div class="invalid-feedback">La contraseña debe tener al menos 4 caracteres.</div>
                    </div>
                    <div class="mb-4">
                        <label for="registro-confirmar" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="registro-confirmar" minlength="4" required>
                        <div class="invalid-feedback">Confirme su contraseña.</div>
                        <div class="form-text text-danger d-none" id="error-confirmacion">Las contraseñas no coinciden.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btn-registro">
                        <i class="bi bi-person-plus me-1"></i>Registrarse
                    </button>
                </form>
                <p class="text-center text-muted small mt-3 mb-0">
                    ¿Ya tiene una cuenta? <a href="login.html">Iniciar sesión</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
